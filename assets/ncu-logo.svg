<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="南昌大学 Nanchang University">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2C59"/>
      <stop offset="55%" stop-color="#123C7A"/>
      <stop offset="100%" stop-color="#1B4B8F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D9B15C"/>
      <stop offset="100%" stop-color="#F2D89A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#gold)"/>
  <rect x="0" y="254" width="1200" height="6" rx="3" fill="url(#gold)"/>

  <!-- 图形标记：书本 + 上升的光弧，寓意求知与向上 -->
  <g transform="translate(96,130)">
    <circle r="62" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
    <circle r="47" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.35"/>
    <path d="M -30 -20 L 0 -32 L 30 -20 L 30 22 L 0 10 L -30 22 Z"
          fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M 0 -32 L 0 10" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <path d="M -22 34 A 34 34 0 0 1 22 34" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 中文校名 -->
  <text x="210" y="118"
        font-family="'Microsoft YaHei','PingFang SC','Source Han Sans SC','Noto Sans SC',sans-serif"
        font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="10">南昌大学</text>

  <!-- 英文校名 -->
  <text x="214" y="162"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="24" font-weight="400" fill="#BFD4F2" letter-spacing="8">NANCHANG UNIVERSITY</text>

  <line x1="214" y1="184" x2="1090" y2="184" stroke="#FFFFFF" stroke-width="1" opacity="0.28"/>

  <!-- 副标题 -->
  <text x="214" y="216"
        font-family="'Microsoft YaHei','PingFang SC','Source Han Sans SC','Noto Sans SC',sans-serif"
        font-size="21" font-weight="400" fill="#9FC0E8" letter-spacing="4">程序设计基础 · 个人作品集　|　Personal Portfolio</text>
</svg>
